<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functional Event Hub (No JS)</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-green: #3b5336;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
            --border-color: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        h1 { margin: 0; font-size: 24px; }

        .auth-container {
            display: flex;
            gap: 10px;
        }

        /* --- Interactive CSS Overlay Architecture --- */
        .modal-toggle {
            display: none;
        }

        .btn {
            background-color: var(--accent-green);
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            text-align: center;
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border-color);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        /* Pure CSS toggle state mapping */
        .modal-toggle:checked + .modal-overlay {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            width: 100%;
            max-width: 360px;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 22px;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }

        /* --- Built-in Form Styling & Validation Layout --- */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 4px;
        }

        /* Native HTML validation focus styling */
        .form-group input:focus:invalid {
            border-color: #ff6b6b;
        }
        
        .form-group input:focus:valid {
            border-color: #51cf66;
        }

        /* --- Interface Workspace Grid --- */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .main-grid { grid-template-columns: 2fr 1fr; }
        }

        .section-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-title {
            margin-top: 0;
            font-size: 18px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* --- Native Filters Form Layout --- */
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .filter-bar input, .filter-bar select {
            padding: 8px 12px;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 4px;
        }

        .event-item {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-approved { background-color: #1b4332; color: #75e6da; }
        .status-pending { background-color: #463f1a; color: #f4d35e; }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .metric-box {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }

        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #75e6da;
        }

        .metric-label {
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- Header & Interactive Modal Workspaces -->
    <header>
        <h1>📍 Local Event Hub</h1>
        <div class="auth-container">
            <label for="login-modal-state" class="btn btn-outline">Login</label>
            <label for="register-modal-state" class="btn">Register</label>
        </div>
    </header>

    <!-- FUNCTIONAL FEATURE 1: User Login (Points to internal anchor now) -->
    <input type="checkbox" id="login-modal-state" class="modal-toggle">
    <div class="modal-overlay">
        <div class="modal-content">
            <label for="login-modal-state" class="close-btn">&times;</label>
            <h3>Account Sign In</h3>
            <form action="#" method="GET">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" name="email" required placeholder="name@domain.com">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" required minlength="6">
                </div>
                <button type="submit" class="btn" style="width: 100%;">Sign In</button>
            </form>
        </div>
    </div>

    <!-- FUNCTIONAL FEATURE 2: User Registration (Points to internal anchor now) -->
    <input type="checkbox" id="register-modal-state" class="modal-toggle">
    <div class="modal-overlay">
        <div class="modal-content">
            <label for="register-modal-state" class="close-btn">&times;</label>
            <h3>Create Account</h3>
            <form action="#" method="GET">
                <div class="form-group">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" name="fullname" required pattern="[A-Za-z\s]{3,}" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="reg-pass">Password</label>
                    <input type="password" id="reg-pass" name="password" required minlength="8" placeholder="Min. 8 characters">
                </div>
                <button type="submit" class="btn" style="width: 100%;">Create Account</button>
            </form>
        </div>
    </div>

    <!-- Main Workspace Application UI Layout -->
    <main class="main-grid">
        
        <!-- Left Column: CRUD & Filter Operations -->
        <div>
            <!-- FUNCTIONAL FEATURE 3: CRUD Creation System (Points to internal anchor now) -->
            <section class="section-card">
                <h2 class="section-title">Create New Event Listing (CRUD)</h2>
                <form action="#" method="GET">
                    <div class="form-group">
                        <label for="event-title">Event Title</label>
                        <input type="text" id="event-title" name="title" required placeholder="e.g., Downtown Farmers Market">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div class="form-group">
                            <label for="event-date">Date</label>
                            <input type="date" id="event-date" name="date" required>
                        </div>
                        <div class="form-group">
                            <label for="event-category">Category Focus</label>
                            <select id="event-category" name="category">
                                <option>Community</option>
                                <option>Music & Art</option>
                                <option>Sports</option>
                                <option>Education</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn">Submit Event Data</button>
                </form>
            </section>
